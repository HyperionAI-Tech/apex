# Eval corpus. Each case: a target, its category, the intent sources it exercises, an optional
# reference spec (hand-written ground truth, renamed R1, R2, ... in the workspace), and the
# expected verdict per property. P* are drafted from the fused Intent Model, E* are examples.
#
# Expected verdicts: proven, refuted, contradiction, unproven, out_of_scope, and
#   holds = true of this code; proven or not (the tactics may not close it), never refuted.
# On planted-bug and conflict entries, anything proven that is not expected proven/holds is a
# false proven and fails the build.

[[case]]
target = "mathx.py::clamp"
category = "known_good"
inputs = ["english", "docstring"]
reference = "specs/clamp.lean"
expected = { P1 = "proven", P2 = "proven", E1 = "proven", E2 = "proven", R1 = "proven", R2 = "proven" }

