[project]
# Distribution name is a placeholder: "apex" is likely taken on PyPI (open decision, handoff section 12).
name = "apex-verify"
version = "0.1.0.dev0"
description = "Turn Python intent into Lean 4 theorems and prove them, or explain exactly why not."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "hypothesis>=6.100",
    "crosshair-tool>=0.0.80",
    "mcp>=2.3",
]

[project.optional-dependencies]
# Warm REPL pool for the fast proof-search loop. Never used on the verdict path.
repl = ["lean-interact>=0.6"]
anthropic = [
    "anthropic>=2.3.0",
]
openai = [
    "openai>=3.41.0",
]

[project.scripts]
apex = "apex.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pyyaml>=6",
    "types-pyyaml",
    "anthropic>=2.3.0",
    "openai>=3.41.0",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

# The pinned Lean project ships inside the wheel as a template; `apex init` copies it to
# ~/.apex/lean/<pin> and fetches the toolchain and Mathlib cache there.
[tool.hatch.build.targets.wheel.force-include]
"lean/lean-toolchain" = "apex/_lean/lean-toolchain"
"lean/lakefile.toml" = "apex/_lean/lakefile.toml"
"lean/lake-manifest.json" = "apex/_lean/lake-manifest.json"
"lean/Apex.lean" = "apex/_lean/Apex.lean"
"lean/Apex" = "apex/_lean/Apex"
"skill/apex-verify" = "apex/_skill/apex-verify"

[tool.hatch.build.targets.sdist]
include = ["src/apex", "lean/lean-toolchain", "lean/lakefile.toml", "lean/lake-manifest.json",
  "lean/Apex.lean", "lean/Apex", "README.md", "LICENSE", "schemas", "skill"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Apex generates Lean, whose notation is Unicode (×, ∧, ≤, ⊢): not confusables here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Corpus code is written the way the translator's subset needs (`[x] + out`, not `[x, *out]`).
"evals/corpus/*" = ["RUF005"]

[tool.pyright]
include = ["src", "tests", "scripts", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lean: needs the pinned Lean toolchain and Mathlib cache (run `apex init` first)",
    "install: builds the wheel and installs it with `uv tool install` (slow; needs uv)",
]
